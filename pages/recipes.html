<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Recipes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body id="recipes-page">
    <header id="header">
      <div class="container header-content">
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <nav id="main-nav">
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      <a href="../index.html" class="back-link"> Back to search </a>
      <section id="recipes-section">
        <h1 class="recipe-suggestions">Recipe Suggestions</h1>
        <p class="based-on-ingredients">
          Based on:
          <span id="selected-ingredients">no ingredients selected</span>
        </p>

        <form id="filter-recipes">
          <h2 class="filter-heading">Difficulty</h2>
          <div id="difficulty-buttons" class="filter-buttons">
            <button id="difficulty-easy" class="btn-secondary filter-button" type="button" data-difficulty="Easy">
              Easy
            </button>
            <button
              id="difficulty-medium"
              class="btn-secondary filter-button"
              type="button"
              data-difficulty="Medium"
            >
              Medium
            </button>
            <button id="difficulty-hard" class="btn-secondary filter-button" type="button" data-difficulty="Hard">
              Hard
            </button>
          </div>
        </form>

        <div class="filter-summary-container">
          <div class="filter-summary-details">
            <span id="active-filters">No active filters</span>
            <span>•</span>
            <span id="matched-recipes">Matched Recipes: 0</span>
          </div>
          <button
            id="clear-filters"
            class="btn-secondary clear-filters-button"
            type="button"
          >
            Clear Filters
          </button>
        </div>

        <div id="recipes-widget" class="recipes-grid">
          <!-- Recipes shows here dynamically -->
           
        </div>
      </section>
    </main>

    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
