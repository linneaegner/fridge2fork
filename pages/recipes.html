<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Recipes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body id="recipes-page">
    <header id="header">
      <div class="container header-content">
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <nav id="main-nav">
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      <a href="../index.html" class="back-link"> Back to search </a>
      <section id="recipes-section">
        <header class="recipes-header">
          <h1 class="recipes-header__title">Recipe Suggestions</h1>
          <p class="recipes-header__subtitle">
            Based on:
            <span id="selected-ingredients">no ingredients selected</span>
          </p>
        </header>

        <form
          id="filter-section"
          class="filters-bar"
          aria-labelledby="filter-section-heading"
        >
          <div class="filters-bar__groups">
            <fieldset class="filters-bar__group">
              <legend id="filter-section-heading" class="filters-bar__label">
                Difficulty
              </legend>
              <div id="difficulty-buttons" class="chip-row">
                <button class="chip" type="button" data-difficulty="Easy">
                  Easy
                </button>
                <button class="chip" type="button" data-difficulty="Medium">
                  Medium
                </button>
                <button class="chip" type="button" data-difficulty="Hard">
                  Hard
                </button>
              </div>
            </fieldset>
          </div>
        </form>

        <div class="filters-status">
          <div class="filters-status__details" role="status" aria-live="polite">
            <span id="active-filters">No active filters</span>
            <span aria-hidden="true">•</span>
            <span id="matched-recipes">Matched Recipes: 0</span>
          </div>
          <button id="clear-filters" class="filters-status__clear" type="button">
            Clear all
          </button>
        </div>

        <div id="food-widget" class="recipe-grid" aria-label="Recipe Grid">
          <!-- Recipe cards will be dynamically inserted here -->
        </div>
      </section>
    </main>

    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
