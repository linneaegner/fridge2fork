<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Contact</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <h1>Fridge2Fork</h1>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Hero Section -->
      <div>
        <h1>Get In Touch</h1>
        <p>Have feedback, suggestions, or questions? We'd love to hear from you!</p>
      </div>

      <!-- Contact Form -->
      <section>
        <h2>Send Us a Message</h2>
        <form>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="your.email@example.com" required />

          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="What's this about?" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us what's on your mind..." rows="6" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
    </footer>
  </body>
</html>
