<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Contact</title>

    <!-- Laddar typsnitt från Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Globala stilmallar -->
    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body id="contact-page">
    <!-- Webbplatsens toppsektion -->
    <header id="header">
      <div class="container header-content">
        <!-- Logotyp och varumärke -->
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <!-- Huvudmeny -->
        <nav id="main-nav" >
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Sidans huvudinnehåll -->
    <main id="main-content" class="container">
      <!-- Inledning till kontaktsidan -->
      <section id="contact-hero">
        <h1>Get In Touch</h1>
        <p>
          Have feedback, suggestions, or questions? We'd love to hear from you!
        </p>
      </section>

      <!-- Själva kontaktformuläret -->
      <section id="contact-section">
        <div class="card contact-card">
          <h2>Send Us a Message</h2>

          <!-- Formulär för att skicka meddelande -->
          <form id="contact-form">
            <!-- Fält för namn -->
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Your name"
              required
            />

            <!-- Fält för e-postadress -->
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="your.email@example.com"
              required
            />

            <!-- Fält för ämne -->
            <label for="subject">Subject</label>
            <input
              id="subject"
              name="subject"
              type="text"
              placeholder="What's this about?"
              required
            />

            <!-- Fält för själva meddelandet -->
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Tell us what's on your mind..."
              rows="6"
              required
            ></textarea>

            <!-- Knapp för att skicka meddelandet -->
            <button type="submit" id="send-message-btn" class="btn-solid">
              Send Message
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- Sidfot med upphovsrätt -->
    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <!-- Länkar in huvudskriptet -->
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
