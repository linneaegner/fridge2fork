<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Contact</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body class="contact-page">
    <!-- ===== HEADER ===== -->
    <header id="header">
      <div class="container header-content">
        <!-- Logo / Brand -->
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <!-- Navigation Menu -->
        <nav id="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content" class="container">
      <!-- Hero / Intro Section -->
      <section id="contact-hero">
        <h1>Get In Touch</h1>
        <p>
          Have feedback, suggestions, or questions? We'd love to hear from you!
        </p>
      </section>

      <!-- Contact Form Section -->
      <section id="contact-section">
        <div class="card contact-card">
          <h2>Send Us a Message</h2>

          <!-- Contact Form -->
          <form id="contact-form">
            <!-- Name Field -->
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Your name"
              required
            />

            <!-- Email Field -->
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="your.email@example.com"
              required
            />

            <!-- Subject Field -->
            <label for="subject">Subject</label>
            <input
              id="subject"
              name="subject"
              type="text"
              placeholder="What's this about?"
              required
            />

            <!-- Message Field -->
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Tell us what's on your mind..."
              rows="6"
              required
            ></textarea>

            <!-- Submit Button -->
            <button type="submit" id="send-message-btn" class="btn-solid">
              Send Message
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
