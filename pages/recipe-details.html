<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Recipe Details</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body id="recipe-details-page">
    <header id="header">
      <div class="container header-content">
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <nav id="main-nav">
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container">
      <a id="back-to-recipes" href="recipes.html" class="back-link">
        Back to recipes
      </a>

      <article id="recipe-details" class="card">
        <div class="recipe-media">
          <img
            id="recipe-image"
            src="https://via.placeholder.com/640x360?text=Loading..."
            alt="Recipe image"
          />
        </div>

        <div class="recipe-info">
          <h1 id="recipe-title"></h1>
          <p id="recipe-summary"></p>

          <dl class="recipe-meta recipe-card__meta">
            <div class="recipe-meta__item recipe-card__meta-item">
              <dt class="sr-only">Time</dt>
              <dd id="recipe-time">
                <span aria-hidden="true" class="recipe-card__icon">⏱️</span>
                <span id="recipe-time-value"></span>
              </dd>
            </div>
            <div class="recipe-meta__item recipe-card__meta-item">
              <dt class="sr-only">Servings</dt>
              <dd id="recipe-servings">
                <span aria-hidden="true" class="recipe-card__icon">👥</span>
                <span id="recipe-servings-value"></span>
              </dd>
            </div>
          </dl>

          <p id="recipe-tags" class="recipe-tags"></p>

          <button id="view-original-btn" class="btn-solid" type="button">
            View Original Recipe
          </button>
        </div>
      </article>

      <section id="recipe-content" class="recipe-lists">
        <div class="card">
          <h2>Ingredients</h2>
          <ul id="ingredients-list"></ul>
        </div>

        <div class="card">
          <h2>Instructions</h2>
          <ol id="instructions-list"></ol>
        </div>
      </section>
    </main>

    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
