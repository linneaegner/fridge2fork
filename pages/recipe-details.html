<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Recipe Details</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="../css/modern_reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body id="recipe-details-page">
    <!-- ===== HEADER ===== -->
    <header id="header">
      <div class="container header-content">
        <!-- Logo / Brand -->
        <a id="logo" href="../index.html">
          <img src="../images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <!-- Navigation Menu -->
        <nav id="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="../index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content" class="container">
      <!-- Back Link -->
      <a id="back-to-recipes" href="recipes.html" class="back-link">
        ← Back to recipes
      </a>

      <!-- Recipe Details Card -->
      <article id="recipe-details" class="card">
        <div class="recipe-media">
          <img
            id="recipe-image"
            src="https://via.placeholder.com/640x360?text=No+image"
            alt="Recipe photo"
          />
        </div>

        <div class="recipe-info">
          <h1 id="recipe-title">Recipe Title</h1>
          <p id="recipe-summary">
            A short summary of the recipe will appear here.
          </p>

          <!-- Recipe Meta Info -->
          <dl class="recipe-meta">
            <div>
              <dt>Time:</dt>
              <dd id="recipe-time">30 min</dd>
            </div>
            <div>
              <dt>Servings:</dt>
              <dd id="recipe-servings">4 servings</dd>
            </div>
          </dl>

          <!-- Recipe Tags -->
          <p id="recipe-tags" class="recipe-tags"></p>

          <!-- View Original Button -->
          <button id="view-original-btn" class="btn-solid" type="button">
            View Original Recipe
          </button>
        </div>
      </article>

      <!-- Ingredients and Instructions -->
      <section id="recipe-content" class="recipe-lists">
        <!-- Ingredients List -->
        <div class="card">
          <h2>Ingredients</h2>
          <ul id="ingredients-list"></ul>
        </div>

        <!-- Instructions List -->
        <div class="card">
          <h2>Instructions</h2>
          <ol id="instructions-list"></ol>
        </div>
      </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <!-- JavaScript File -->
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
