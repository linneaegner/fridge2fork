<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Turn Ingredients into Recipes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/modern_reset.css" />
    <link rel="stylesheet" href="css/global.css" />
  </head>

  <body id="home-page">
    <header>
      <div class="header-container">
        <a class="header-logo" href="index.html">
          <img src="images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <nav id="header-nav">
          <ul>
            <li><a href="index.html" class="nav-link active">Home</a></li>
            <li><a href="pages/about.html" class="nav-link">About</a></li>
            <li><a href="pages/contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section id="home-hero" >
        <h1>Turn Your Fridge Into Delicious Meals</h1>
        <p>
          Waste less food and find recipes based on the ingredients you already
          have at home.
        </p>
      </section>

      <section id="fridge-section" >
        <div class="card">
          <h2>What's in your fridge?</h2>

          <form id="ingredient-form">
            <div class="input-row">
              <input
                type="text"
                id="ingredient-input"
                name="ingredients"
                placeholder="Add an ingredient (e.g., chicken, pasta, tomato)"
              />
              <button type="button" id="add-ingredient-btn" class="btn-secondary">
                Add
              </button>
            </div>

            <div class="ingredient-list">
              <div id="ingredient-tags"></div>
              <button
                type="button"
                id="clear-ingredients-btn"
                class="btn-clear"
              >
                Clear All
              </button>
            </div>

            <button type="submit" id="find-recipes-btn" class="btn-primary">
              Find Recipes
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
