<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Turn Ingredients into Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/modern_reset.css" />
    <link rel="stylesheet" href="css/global.css" />
  </head>
  <body class="home-page">
    <header class="site-header">
      <div class="site-header__inner container">
        <a class="brand" href="index.html">
          <span class="brand__icon">
            <img src="images/fork.png" alt="Fridge2Fork logo" />
          </span>
          <span class="brand__name">Fridge2Fork</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <ul class="site-nav__list">
            <li><a href="index.html">Home</a></li>
            <li><a href="pages/about.html">About</a></li>
            <li><a href="pages/contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="home-main">
      <section class="home-hero container">
        <!-- <span class="home-hero__icon" aria-hidden="true">🍴</span> -->
        <h1 class="home-hero__title">Turn Your Fridge Into Delicious Meals</h1>
        <p class="home-hero__subtitle">
          Waste less food and find recipes based on the ingredients you already
          have at home.
        </p>
      </section>

      <section class="ingredient-section">
        <div class="ingredient-card card">
          <h2 class="ingredient-card__title">What's in your fridge?</h2>
          <form id="ingredient-form" class="ingredient-form">
            <label class="ingredient-card__hint" for="ingredients">
              Enter the ingredients you want to use and we'll suggest recipes that match.
            </label>
            <div class="ingredient-input-row">
              <input
                type="text"
                id="ingredients"
                name="ingredients"
                placeholder="e.g., chicken, rice"
              />
              <button
                type="button"
                id="add-ingredient"
                class="btn btn-outline ingredient-add"
              >
                Add
              </button>
            </div>
            <div class="ingredient-chip-row">
              <div
                id="ingredient-badges"
                class="ingredient-badges"
                aria-live="polite"
              ></div>
              <button
                type="button"
                id="clear-ingredients"
                class="ingredient-clear"
              >
                Clear all
              </button>
            </div>
            <button
              type="submit"
              class="btn btn-solid btn-full ingredient-submit"
            >
              Find Recipes
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons"
          >Fork icons created by Freepik - Flaticon</a
        >
      </div>
    </footer>
    <script src="js/script.js" type="module"></script>
  </body>
</html>
