<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fridge2Fork - Turn Ingredients into Recipes</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/modern_reset.css" />
    <link rel="stylesheet" href="css/global.css" />
  </head>

  <body id="home-page">
    <!-- ===== HEADER ===== -->
    <header id="header">
      <div class="container header-content">
        <!-- Logo / Brand -->
        <a id="logo" href="index.html">
          <img src="images/fork.png" alt="Fridge2Fork logo" />
          <span>Fridge2Fork</span>
        </a>

        <!-- Navigation Menu -->
        <nav id="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="pages/about.html" class="nav-link">About</a></li>
            <li><a href="pages/contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content">
      <!-- Hero Section -->
      <section id="hero" class="container">
        <h1>Turn Your Fridge Into Delicious Meals</h1>
        <p>
          Waste less food and find recipes based on the ingredients you already
          have at home.
        </p>
      </section>

      <!-- Ingredient Form Section -->
      <section id="ingredients-section" class="container">
        <div class="card">
          <h2>What's in your fridge?</h2>

          <!-- Ingredient Form -->
          <form id="ingredient-form">
            <label for="ingredient-input">
              Enter the ingredients you want to use, and we'll suggest recipes
              that match.
            </label>

            <!-- Input Row -->
            <div class="input-row">
              <input
                type="text"
                id="ingredient-input"
                name="ingredients"
                placeholder="e.g., chicken, rice"
              />
              <button type="button" id="add-ingredient-btn" class="btn-outline">
                Add
              </button>
            </div>

            <!-- Ingredient List Row -->
            <div class="ingredient-list">
              <div id="ingredient-tags"></div>
              <button type="button" id="clear-ingredients-btn" class="btn-clear">
                Clear all
              </button>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="find-recipes-btn" class="btn-solid">
              Find Recipes
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
      <div class="container">
        <p>&copy; 2025 Fridge2Fork. All rights reserved.</p>
        <a href="https://www.flaticon.com/free-icons/fork" title="fork icons">
          Fork icons created by Freepik - Flaticon
        </a>
      </div>
    </footer>

    <!-- JavaScript File -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
